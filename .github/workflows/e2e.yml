name: E2E (Selenium)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL da aplicação publicada
        required: false
        default: https://andreygregorio.github.io/MainCourse/

permissions:
  contents: read

jobs:
  e2e:
    name: Selenium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/selenium/requirements.txt

      - name: Instalar dependências
        run: pip install -r tests/selenium/requirements.txt

      - name: Rodar testes
        env:
          BASE_URL: ${{ inputs.base_url }}
          HEADLESS: '1'
        run: pytest tests/selenium
